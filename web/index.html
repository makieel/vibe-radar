<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Radar</title>
<script>
  (function () {
    var m = null;
    try { m = localStorage.getItem('vr-mode'); } catch (e) {}
    if (m !== 'light' && m !== 'dark') {
      m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-mode', m);
  })();
</script>
<style>html[data-mode=dark]{background:#070814} html[data-mode=light]{background:#f3f5fc}</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="core/app.js"></script>
</body>
</html>
